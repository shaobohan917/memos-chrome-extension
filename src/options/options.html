<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="settingsTitle">Memos Notes - Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Fraunces:ital,opsz,wght@0,9..72,400;0,9..72,600;0,9..72,700;1,9..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 data-i18n="settingsHeading">Memos Notes Settings</h1>
    </header>

    <main class="main">
      <form id="settingsForm" class="settings-form">
        <div class="form-group">
          <label for="apiUrl" data-i18n="apiUrlLabel">API URL *</label>
          <input
            type="url"
            id="apiUrl"
            name="apiUrl"
            data-i18n-placeholder="apiUrlPlaceholder"
            placeholder="https://your-memos.com"
            required
          >
          <small data-i18n="apiUrlHelp">Enter your Memos server URL (without the /api path)</small>
        </div>

        <div class="form-group">
          <label for="apiKey" data-i18n="apiKeyLabel">Access Token (optional)</label>
          <input
            type="password"
            id="apiKey"
            name="apiKey"
            data-i18n-placeholder="apiKeyPlaceholder"
            placeholder="Create one in Memos Settings → Access Tokens"
          >
          <small data-i18n="apiKeyHelp">View and create all your notes, including private notes. Create a token in Memos Settings → Access Tokens.</small>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-primary" data-i18n="saveSettings">Save Settings</button>
          <button type="button" id="testBtn" class="btn-secondary" data-i18n="testConnection">Test Connection</button>
        </div>
      </form>

      <div id="statusMessage" class="status-message hidden"></div>

      <section class="info-section">
        <h2 data-i18n="aboutMemos">About Memos</h2>
        <p data-i18n="aboutDescription">Memos is a lightweight note-taking app that supports Docker deployment.</p>
        <a href="https://github.com/usememos/memos" target="_blank" rel="noopener" data-i18n="viewMemosOnGithub">
          View Memos on GitHub
        </a>
      </section>
    </main>
  </div>

  <script src="../i18n.js"></script>
  <script src="options.js"></script>
</body>
</html>
