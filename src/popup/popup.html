<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="extensionName">Memos Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Fraunces:ital,opsz,wght@0,9..72,400;0,9..72,600;0,9..72,700;1,9..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1 data-i18n="extensionName">Memos Notes</h1>
      <button id="settingsBtn" class="icon-btn" data-i18n-title="settings" data-i18n-aria-label="settings" title="Settings" aria-label="Settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M12 1v6m0 6v6m9-9h-6m-6 0H3m15.364 6.364l-4.243-4.243M9.879 9.879L5.636 5.636m12.728 12.728l-4.243-4.243m-4.242 0L5.636 18.364"></path>
        </svg>
      </button>
    </header>

    <!-- Quick Add Form -->
    <div class="quick-add">
      <textarea
        id="noteInput"
        data-i18n-placeholder="quickNotePlaceholder"
        placeholder="Write a quick note..."
        rows="3"
      ></textarea>
      <button id="addBtn" class="btn-primary" data-i18n="addNote">Add Note</button>
    </div>

    <!-- Notes List -->
    <div class="notes-section">
      <div class="notes-header">
        <h2 id="notesTitle" data-i18n="recentNotes">Recent Notes</h2>
        <div class="notes-actions">
          <button id="openMemosBtn" class="icon-btn" data-i18n-title="openMemos" data-i18n-aria-label="openMemos" title="Open Memos" aria-label="Open Memos">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 3h7v7"></path>
              <path d="M10 14 21 3"></path>
              <path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"></path>
            </svg>
          </button>
          <button id="refreshBtn" class="icon-btn" data-i18n-title="refresh" data-i18n-aria-label="refresh" title="Refresh" aria-label="Refresh">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
              <path d="M3 3v5h5"></path>
            </svg>
          </button>
        </div>
      </div>
      <div class="search-box">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m20 20-4-4"></path>
        </svg>
        <input id="searchInput" type="search" data-i18n-placeholder="searchAllNotes" data-i18n-aria-label="searchAllNotes" placeholder="Search all notes..." aria-label="Search all notes...">
        <button id="clearSearchBtn" class="clear-search-btn hidden" data-i18n-title="clearSearch" data-i18n-aria-label="clearSearch" type="button" title="Clear search" aria-label="Clear search">×</button>
      </div>
      <div id="notesList" class="notes-list">
        <div class="loading" data-i18n="loading">Loading...</div>
      </div>
    </div>

    <!-- Status Message -->
    <div id="statusMessage" class="status-message hidden"></div>
  </div>

  <script src="../i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
